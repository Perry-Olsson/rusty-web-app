name: CI

on:
  push:
    branches:
      - commit-stage-job

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tester image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tester
          load: true
          tags: rusty-web-app:tester
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm rusty-web-app:tester cargo nextest run --release

      - name: Build final image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rusty-web-app:latest
          cache-from: type=gha
